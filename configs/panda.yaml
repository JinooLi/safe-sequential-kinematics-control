robot:
  model_path: ../assets/robots/panda.xml
  ee_frame: gripper_tip
  dof: 7
  initial_q: [-1.57079, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]

target:
  # Base/world-frame target. Vector magnitudes are ignored. The gripper tip's
  # local +z axis follows approach and its local +y axis follows up.
  position: [0.45, 0.45, 0.45]
  orientation:
    approach: [0.0, 1.0, 0.0] # gripper_tip local +z
    up: [1.0, 0.0, 0.0] # gripper_tip local +y
  position_tolerance: 0.01
  orientation_tolerance: 0.01

safe_ik:
  self_collision_model: capsule # rdf 또는 capsule; 생략/null이면 safety 설정을 따름.
  iteration_number: 1000 # 시드당 최대 반복 횟수; 실제 실행 시간 제한이 아님.
  # Accept a candidate only after pose and safety conditions remain satisfied
  # for ceil(duration / 0.01) consecutive iterations (3.0 = 300 iterations).
  # The internal numerical step stays at 0.01; this is not wall-clock time.
  convergence_hold_duration: 3.0
  workers: 5 # 독립 프로세스 수; 1이면 직렬 실행. seed 수보다 많이 만들지 않음.
  max_restarts: 20 # 첫번째 seed는 현재 위치에서 시작함.
  random_seed: 0 # 랜덤 seed를 만들기 위한 seed.
  damping: 0.001 # damped pseudo inverse 사용
  pose_gain: 100.0 #
  softmin_temperature: 10 # log-sum-exp에 있는 그 상수
  safety_gradient_gain: 10.0 # null space control부의 gain. 이걸로 safety 제어함.

safety:
  self_collision_model: rdf
  rdf:
    artifact: ../models/panda_rdf.npz
    # Direct CLI default. Panda Make targets override with PANDA_RDF_DEVICE=cuda.
    runtime_device: cpu # make panda-view PANDA_RDF_DEVICE=cpu for explicit CPU.
    query_density: 500.0 # m^-2; changing this regenerates query points offline
    top_k: 2  # null uses all query points
    sphere_gate: true # Far pairs: sphere barrier only; near pairs: RDF.
    # Width = fraction * (sum of outer radii - sum of verified bounds - margin).
    # Must be strictly between 0 and 1; does not change the trained model.
    sphere_gate_transition_fraction: 0.5
    softmin_error: 0.005 # m; not subtracted from barrier again
    # m; runtime allows 0 <= value <= trained physical_margin (this model: 0.030).
    # Reducing this changes CBF clearance only; trained radii/weights stay fixed.
    physical_margin: 0.010
    # m; overestimation limit AND CBF uncertainty margin (0.040 m total at 0.030).
    # Also changes training radii; a 5 mm artifact must not be relabeled/reused.
    error_margin: 0.010
    # m; separate offline underestimation limit; does NOT alter CBF or radii.
    # Requires explicit revalidation; never relabel a legacy report as passing.
    underestimation_limit: 0.020
    transition_ratio: 0.5
    cbf_gain: 1.0
    seed: 0
  margin: 0.05
  alpha: 0.3
  # Explicit self-pair exclusions; obstacle checks remain enabled.
  self_collision_exclusions:
    - [link7, gripper] # Fixed hand assembly (capsule backend).
    - [link6, hand] # User-approved wrist pair exclusion (2026-09-30).
    - [link5, link7] # 애초에 너무 가까이 있음
  # Endpoints are expressed in each named frame's local coordinates. Adjacent
  # capsules are omitted from self-collision pairs; all others are checked.
  capsules:
    - {
        name: base,
        start_frame: link0,
        end_frame: link0,
        start_offset: [0.0667, -0.0037, 0.1167],
        end_offset: [-0.1561, 0.0013, 0.0040],
        radius: 0.04,
      }
    - {
        name: link1,
        start_frame: link1,
        end_frame: link1,
        start_offset: [-0.0072, 0.0447, -0.1985],
        end_offset: [0.0017, -0.1113, 0.0439],
        radius: 0.025,
      }
    - {
        name: link2,
        start_frame: link2,
        end_frame: link2,
        start_offset: [-0.0006, 0.0447, 0.1101],
        end_offset: [0.0015, -0.2024, -0.0413],
        radius: 0.025,
      }
    - {
        name: link3,
        start_frame: link3,
        end_frame: link3,
        start_offset: [0.1167, 0.0923, 0.0309],
        end_offset: [-0.0549, -0.0402, -0.0994],
        radius: 0.025,
      }
    - {
        name: link4,
        start_frame: link4,
        end_frame: link4,
        start_offset: [0.0345, -0.0304, 0.0932],
        end_offset: [-0.1367, 0.1036, -0.0406],
        radius: 0.025,
      }
    - {
        name: link5,
        start_frame: link5,
        end_frame: link5,
        start_offset: [0.0050, -0.0043, -0.2769],
        end_offset: [0.0031, 0.1165, 0.0423],
        radius: 0.025,
      }
    - {
        name: link6,
        start_frame: link6,
        end_frame: link6,
        start_offset: [-0.0444, -0.0152, 0.0313],
        end_offset: [0.1291, 0.0458, -0.0076],
        radius: 0.025,
      }
    - {
        name: link7,
        start_frame: link7,
        end_frame: link7,
        start_offset: [-0.0363, -0.0395, 0.0796],
        end_offset: [0.0613, 0.0633, 0.0858],
        radius: 0.02,
      }
    - {
        name: hand,
        start_frame: hand,
        end_frame: hand,
        start_offset: [-0.0003, -0.1044, 0.0204],
        end_offset: [0.0009, 0.1011, 0.0250],
        radius: 0.02,
      }
    - {
        name: gripper,
        start_frame: hand,
        end_frame: gripper_tip,
        start_offset: [0.0, 0.0, 0.04],
        end_offset: [0.0, 0.0, 0.0],
        radius: 0.02,
      }

obstacles:
  - {
      name: obstacle1,
      position: [0.25, -0.1, 0.55],
      radius: 0.10,
      enabled: true,
    }
  - {
      name: obstacle2,
      position: [0.25, -0.35, 0.45],
      radius: 0.10,
      enabled: true,
    }

trajectory:
  success_barrier_tolerance: 1.0e-6
  stop_progress_window: 2.0
  stop_progress_tolerance: 0.001
  duration: 90.0
  integration_period: 0.01
  # sequential: link endpoint position stages, then final EE pose.
  # direct: final EE pose CLF only. Neither mode uses a configuration CLF.
  mode: sequential
  # Frame origins: link2 is fixed; link3 and link5 provide moving position goals.
  stage_frames: [link3, link5]
  stage_position_tolerance: 0.05
  orientation_weight: 1.0
  stop_window: 0.5 # seconds; low mean speed plus insufficient task progress triggers a stall.
  stop_velocity_tolerance: 0.001
  clf_rate: 20.0
  clf_slack_weight: 1000.0
  # One third of Panda's configured nominal limits.
  velocity_limits: [0.145, 0.145, 0.145, 0.145, 0.175, 0.175, 0.175]
  acceleration_limits:
    [5.0, 2.5, 3.33333333, 4.16666667, 5.0, 6.66666667, 6.66666667]

qp:
  joint_velocity_weight: 1.0
  # OSQP stops at this iteration limit. A larger value avoids treating a
  # slow-to-converge, slack-feasible first step as an infeasible QP.
  max_iterations: 20000
  absolute_tolerance: 0.001
  relative_tolerance: 0.001
