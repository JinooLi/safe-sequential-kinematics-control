dof: 3
ee_obj: [-1.0, 1.3]
# End-effector 목표 yaw [rad]. 0은 world x축을 향하는 자세다.
ee_orientation: 1.57
# 목표 수렴 constraint 선택: clf | clbf
control_mode: clf

# root에서 시작해 각 링크의 반대쪽 끝을 차례대로 task end-effector로 사용한다.
# 모든 링크는 우선 위치 CLF/CLBF만 사용한다. 마지막 link3가 목표 위치 허용
# 오차 안에 들어오면 그때부터 목표 yaw까지 포함해 제어한다.
# QP가 infeasible하거나 목표에 가까워지거나 CBF 경계에서 멈추면 다음 링크로 전환한다.
# 마지막 link3(ee_joint)에서는 전환하지 않는다.
sequential_end_effector:
  enabled: true
  frame_names: [joint2, joint3, ee_joint]
  goal_tolerance: 0.3 # 목표 위치 허용 오차 [m]
  velocity_tolerance: 0.001 # 정지 판정 관절 속도 norm [rad/s]
  barrier_tolerance: 0.001 # CBF h 경계 근접 판정 [m]

# Headless randomized comparison.  These values do not change the controller
# itself; they apply only to `make compare-sequential ARGS="run"`.
sequential_experiment:
  cases: 72
  # Parallel processes. Each process runs one sequential-off/on case pair.
  workers: 12
  seed: 23
  duration: 30.0
  # Success criterion, independent from sequential_end_effector.goal_tolerance.
  goal_tolerance: 0.05
  yaw_tolerance: 0.10
  barrier_tolerance: -0.001
  # null uses control_mode above; set clf or clbf to override it for the batch.
  control_mode: null
  initial_q: [0.0, 0.0, 0.0]
  output_dir: outputs/sequential_comparison
  target_radius_range: [0.6, 2.7]
  target_angle_range: [-3.141592653589793, 3.141592653589793]
  target_orientation_range: [-3.141592653589793, 3.141592653589793]
  obstacle_position_range: [-2.2, 2.2]
  obstacle_radius_range: [0.2, 0.35]
  initial_clearance_margin: 0.03
  target_clearance_margin: 0.10
  max_case_attempts: 10000
  max_obstacle_attempts: 1000

obstacle:
  - radius: 0.3
    pos: [-0.5, 1.4]
    # false이면 CBF 제약과 MuJoCo/RDF 시각화에서 모두 제외한다.
    enabled: True
  - radius: 0.3
    pos: [-1.45, 1.1]
    enabled: True

# Exact capsule-SDF CBF.  link_lengths/radius must match settings/urdf.xml
# and settings/mujoco.xml.  ``safe_distance`` is the clearance beyond both
# physical radii; increase it later by the measured RDF approximation error.
safety:
  enabled: true
  # The checked-in model was trained with `python -m src.train_rdf --degree 12
  # --samples 12000 --seed 0`.  Its sampled max error was 0.024857 m; the
  # 0.08 m margin below retains the desired 0.05 m physical clearance plus a
  # rounded-up RDF error allowance.  Re-measure after every retraining.
  representation: bernstein # capsule | bernstein
  rdf_model_path: models/planar_bernstein_rdf.npz
  link_lengths: [1.0, 1.0, 1.0]
  link_radius: 0.05
  # CBF 여유 거리 [m]. h = f_link(p_obs, q) - obstacle_radius - safe_distance
  # 에서 사용하며, h >= 0이면 충돌 반경을 포함한 이 여유를 만족한다.
  safe_distance: 0.08
  # CBF class-K 이득. 각 barrier에 대해 h_dot + alpha * h >= 0을 강제한다.
  alpha: 1
  # Joint-limit zeroing CBF. null means an unbounded joint (joint1).
  # Each finite [lower, upper] pair enforces q_min <= q_i <= q_max.
  joint_limits: [null, [-3.14, 3.14], [-3.14, 3.14]]
  joint_limit_alpha: 1.0
  # QP가 출력하는 각 관절 속도의 절댓값 상한 [rad/s]. -limit <= q_dot_i <= limit.
  velocity_limit: 4.0
  # CLF 수렴 이득. V_dot <= -clf_rate * V + delta에서 사용한다.
  # 클수록 slack(delta)이 없을 때 목표점으로의 수렴을 더 강하게 요구한다.
  clf_rate: 1.0

# CLBF-QP. end-effector--장애물 barrier 두 개만 순서대로 누적한다.
# b_i = r_i + r_ee + safe_distance - ||p_ee - p_obs,i||,
# B_i = max(b_i, 0)^2 - epsilon_i,
# W_k = W_(k-1) + lambda_k * B_k + kappa_k. 마지막 W_2만 QP에 넣는다.
clbf:
  gamma: 1.0
  # Shifted CLBF slack uses alpha(s) = slack_alpha * s:
  # 0 <= delta <= d * alpha(W - W_goal).
  slack_alpha: 1.0
  # MuJoCo ee_geom sphere radius와 반드시 같아야 한다.
  end_effector_radius: 0.06
  barriers:
    # 첫 번째 barrier의 epsilon, lambda, kappa만 직접 선택한다.
    - { obstacle_index: 1, epsilon: 0.01, lambda: 400.0, kappa: 0.1 }
    # epsilon_2는 epsilon_1을 그대로 쓰며, c_{2,3}는 장애물/목표 기하에서 계산한다.
    # 논문의 재귀식으로 lambda_2, kappa_2를 자동 생성한다.
    - { obstacle_index: 2, auto_from_previous: true }

QP_ctrl:
  R:
    - [1, 0, 0]
    - [0, 0.5, 0]
    - [0, 0, 0.25]
  Q:
    - [3]
  # CLF/CLBF convergence slack: 0 <= delta <= d * V.
  # 안전 CBF 제약은 delta로 완화하지 않는다.
  d: 0.9
