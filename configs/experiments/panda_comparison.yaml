# 이 파일의 입력·출력 경로는 이 실험 YAML이 있는 디렉토리를 기준으로 해석한다.
controller_config: ../panda.yaml
rdf_device: cuda
output_root: ../../outputs/panda_comparison
output: null # null이면 새 결과 폴더를 생성한다. 같은 실험을 재개하려면 기존 폴더를 지정한다.

# 아래 장면들로 직접 제어와 순차 제어의 성공률·도달 시간·안전성을 비교한다.
main:
  seeds: [2332, 2333, 2334, 2335, 2336] # 장면 생성용 난수 시드이며, IK 탐색의 초기 자세 수와는 별개다.
  cases_per_seed: 60 # 전체 장면 수 = 시드 개수 × 시드당 장면 수. 장면마다 두 방법을 비교한다.

# 아래 값만 공통 제어 설정에 덮어쓴다. 일반 panda-view 실행에는 적용하지 않는다.
# 이 항목 안의 로봇·학습 모델 경로는 controller_config 파일이 있는 디렉토리를 기준으로 해석한다.
controller_overrides:
  trajectory:
    duration: 90.0
    integration_period: 0.01
    clf_rate: 20.0
    clf_slack_weight: 1000.0
    stage_frames: [link3, link5]
    stage_position_tolerance: 0.05
    orientation_weight: 1.0
    velocity_limits: [0.145, 0.145, 0.145, 0.145, 0.175, 0.175, 0.175]
    # 일반 제어기의 목표 성공 판정 허용오차(m). 비교 실험의 success는 전체 경로 h >= 0으로 별도 판정한다.
    success_barrier_tolerance: 1.0e-6
    stop_window: 0.5
    stop_velocity_tolerance: 0.001
    stop_progress_window: 2.0
    stop_progress_tolerance: 0.001
  qp:
    absolute_tolerance: 0.001
    relative_tolerance: 0.001

# 목표 위치·자세와 장애물은 공통 제어 설정 대신 난수로 생성한 장면의 값을 사용한다.
# 초기 관절각과 목표 위치·자세 허용오차는 공통 설정을 따르며, 위 항목에서 덮어쓸 수도 있다.
sampling:
  workspace_lower: [-0.7, -0.7, 0.1]
  workspace_upper: [0.7, 0.7, 1.0]
  obstacle_count: 2
  obstacle_radius_range: [0.04, 0.10]
  minimum_target_distance: 0.15
  joint_limit_margin: 0.1
  minimum_barrier: 0.005
  max_proposals_per_seed: 10000

validation:
  subdivisions: 5 # 제어 구간을 5등분하고, 내부 보간 상태 4개에서 안전값을 추가로 검사한다.
