# Link4 GPU comparison: only basis_count differs from panda_rdf_training.yaml.
# Official BP_24 means 24 Bernstein basis functions/axis, degree 23, 24^3 coefficients.
# Keep the same saved pools, 200 batches, validation points, float64 and 5 mm gate.
basis_count: 24
updates: 200
near_batch: 1024
random_batch: 256
pool_size: 500000
regularization: 0.0001
scan_count: 100
scan_resolution: 400
normal_count: 100
reconstruction:
  voxel_resolution: 128
  scan_count: 100
  scan_resolution: 400
  normal_sample_count: 100
  sample_point_count: 10000000
  sdf_batch_size: 2048
  comparison_samples: 5000
maximum_samples: 10000
maximum_starts: 20
optimizer_ftol: 1.0e-12
