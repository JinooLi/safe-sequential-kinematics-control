# 공식 RDF 참조 커밋: dc08da7ec78e7cfb002f5a118d06d9eebbf9c37d.
# 아래 설정은 각 링크 형상의 오프라인 학습과 구 표면 최댓값 추정에 공통 적용한다.
# 난수 시드·형상·질의점·검증 허용 오차는 configs/panda.yaml의 safety.rdf에서 설정한다.

# 축당 Bernstein 기저 함수 개수. BP_8은 축당 7차이며, 3차원 계수는 8^3 = 512개다.
# 2 이상이어야 하며, 늘리면 표현력과 학습·평가 비용이 함께 증가한다.
basis_count: 8
# 링크당 재귀 릿지 계수 갱신 횟수. 전체 표본 풀을 한 번씩 순회하는 에포크 수가 아니다.
updates: 200
# 한 번 갱신할 때 표면 근처 표본 풀에서 뽑는 점 개수. 같은 배치 안에서는 중복 없이 뽑는다.
near_batch: 1024
# 한 번 갱신할 때 외부 학습 구 내부의 균일 무작위 풀에서 뽑는 점 개수.
# 갱신당 총 표본 수는 near_batch + random_batch이며, 갱신 간 표본 재사용은 가능하다.
random_batch: 256
# 링크당 표본 풀 하나의 크기. 표면 근처 풀과 균일 무작위 풀을 각각 이 개수만큼 만든다.
# 표면 근처 풀도 약 6%의 균일 표본을 포함한다. 두 배치 크기 이상이어야 한다.
pool_size: 500000
# 재귀 릿지의 양수 정규화 계수 λ. 초기 행렬은 B₀ = I/λ, 초기 학습 계수는 0이다.
# 목표 거리를 학습 반지름으로 나눈 정규화 회귀에 적용하며, 값이 클수록 계수를 더 억제한다.
regularization: 0.0001

# 학습 거리 라벨용 표면 점군을 만들 때 사용하는 가상 카메라 시점 수. 2 이상이어야 한다.
scan_count: 100
# 시점당 깊이·법선 렌더링 영상의 한 변 해상도(픽셀). 400이면 400×400 영상이다.
scan_resolution: 400
# 거리 부호(내부/외부)를 법선 다수결로 판정할 때 참고하는 최근접 표면 점 개수.
# 거리 크기는 가장 가까운 표면 점까지의 거리이며, 법선 개수로 평균하지 않는다.
normal_count: 100

# C1 구형 확장에 필요한 최댓값 M을 추정할 때 내부 구 표면에 배치하는 Fibonacci 표본 수.
# 학습 데이터 수나 독립 검증점 수가 아니다. 표본 평가만으로 전역 최댓값을 보증하지 않는다.
maximum_samples: 10000
# 표본값이 큰 후보들에서 분산해 고르는 SLSQP 국소 최대화 시작점 개수.
# maximum_samples 이하여야 하며, 늘리면 최댓값 탐색 비용이 증가한다.
maximum_starts: 20
# 위 SLSQP 최댓값 탐색의 수렴 허용 오차(ftol). 목적함수는 미터 단위 거리의 음수다.
# 양수여야 하며, 거리 검증 합격 기준이나 전역 최댓값 오차 보증을 의미하지 않는다.
optimizer_ftol: 1.0e-12
